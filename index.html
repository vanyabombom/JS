<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Add New Color</h2>
        <div class="form-group">
            <label for="color-name">Color Name:</label>
            <input type="text" id="color-name" placeholder="Enter color name">
        </div>
        <div class="form-group">
            <label for="color-type">Type:</label>
            <select id="color-type">
                <option value="RGB">RGB</option>
                <option value="RGBA">RGBA</option>
                <option value="HEX">HEX</option>
            </select>
        </div>
        <div class="form-group">
            <label for="color-code-r">Code:</label>
            <div class="rgb-inputs">
                <input type="number" id="color-code-r" placeholder="R" min="0" max="255">
                <input type="number" id="color-code-g" placeholder="G" min="0" max="255">
                <input type="number" id="color-code-b" placeholder="B" min="0" max="255">
            </div>
        </div>
        <button id="save-button">Add</button>
    </div>
    <div id="color-display"></div>
    <script src="main.js"></script>
</body>
</html>
